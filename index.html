<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluxoZynxTV</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@300;400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
</head>
<body>
  <div class="app">
    <!-- NAV -->
    <nav class="nav" id="nav">
      <div class="nav-left">
        <a href="#" class="logo" id="logoHome">FLUXO<span>ZYNX</span>TV</a>
        <ul class="nav-links">
          <li><button class="nav-link active" data-tab="home">Início</button></li>
          <li><button class="nav-link" data-tab="live">TV ao Vivo</button></li>
          <li><button class="nav-link" data-tab="movies">Filmes</button></li>
          <li><button class="nav-link" data-tab="series">Séries</button></li>
          <li><button class="nav-link" data-tab="continue">Continuar</button></li>
          <li><button class="nav-link" data-tab="watchlater">Minha Lista</button></li>
        </ul>
      </div>
      <div class="nav-right">
        <div class="search-wrap">
          <button class="icon-btn" id="btnSearchToggle" title="Buscar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
          <input type="text" id="searchInput" class="search-input" placeholder="Títulos, canais..." autocomplete="off">
        </div>
        <button class="icon-btn" id="btnPlaylist" title="Carregar M3U">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </button>
        <input type="file" id="m3uFile" accept=".m3u,.m3u8" hidden>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <p class="hero-badge" id="heroBadge">Destaque</p>
        <h1 class="hero-title" id="heroTitle">Carregue sua playlist</h1>
        <p class="hero-desc" id="heroDesc">Importe um arquivo M3U e comece a assistir TV ao vivo, filmes e séries com qualidade de cinema.</p>
        <div class="hero-actions">
          <button class="btn-play" id="heroPlay">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Assistir
          </button>
          <button class="btn-info" id="heroLater">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            Minha Lista
          </button>
        </div>
      </div>
    </section>

    <!-- ROWS -->
    <main class="content" id="content">
      <div id="rowsContainer"></div>
    </main>

    <!-- PLAYER MODAL -->
    <div class="player-modal" id="playerModal">
      <div class="player-container">
        <button class="player-close" id="playerClose" title="Fechar">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <video id="video" controls playsinline></video>
        <div class="player-info">
          <h2 id="playerTitle">—</h2>
          <span id="playerMeta"></span>
          <button class="btn-mini" id="btnWatchLater">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            Minha Lista
          </button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>FluxoZynxTV • Progresso salvo no navegador • Use apenas conteúdo legítimo</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
